name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # أول مرة فقط: فك ضغط project.zip وحفظ الملفات في المستودع ليصير قابلاً للتعديل
      - name: Expand project.zip
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm project.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # أجهزة GitHub فيها Android SDK جاهز؛ نكتفي بقبول التراخيص
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TweetMe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TweetMe-apk
          path: TweetMe.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TweetMe.apk \
            --title "Tweet me (latest build)" \
            --notes "Latest build from commit ${GITHUB_SHA::7}" \
            --prerelease \
            --target "$GITHUB_SHA"
